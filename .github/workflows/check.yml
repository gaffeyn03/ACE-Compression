name: Offline artifact checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/prepare_results/check_processed_results.py
      - run: python scripts/prepare_results/validate_release.py --skip-manifest
      - run: python -m unittest discover -s tests -v
